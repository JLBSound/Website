<form class="form" data-quote data-endpoint="" action="mailto:joe@jlbsound.com" method="post" enctype="text/plain">
  <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" autocomplete="name" required></div>
  <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
  <div class="field"><label for="f-project">What's the project?</label><input id="f-project" name="project" placeholder="Feature film, series, documentary" required></div>
  <div class="field"><label for="f-due">When is it due?</label><input id="f-due" name="due" placeholder="Delivery date"></div>
  <div class="trap" aria-hidden="true"><label for="f-website">Leave this empty</label><input id="f-website" name="website" tabindex="-1" autocomplete="off"></div>
  <div class="form-end"><button class="btn" type="submit">Get a Quote</button><span>or call <a href="tel:+18013187783">801-318-7783</a></span></div>
  <p class="status" role="status"></p>
</form>
