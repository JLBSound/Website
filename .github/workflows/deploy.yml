name: Publish website to Bluehost
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: python3 build.py
      - name: Upload to Bluehost
        # Uploads only new or changed files into the FTP account's folder
        # (public_html). Files that didn't come from this repo, such as the
        # reel video, the Weebly backup and heroeslikeyou, are never deleted.
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./site/
          server-dir: ./
